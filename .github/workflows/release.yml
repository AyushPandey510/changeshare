name: Build Linux release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the Node.js CLI package
        run: |
          npm run build
          mkdir -p changeshare-node-package
          cp package.json package-lock.json README.md changeshare-node-package/
          cp -r dist changeshare-node-package/dist
          (cd changeshare-node-package && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          tar -czf changeshare-node.tar.gz -C changeshare-node-package .
          ls -lh changeshare-node.tar.gz
      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package --out ../changeshare-vscode.vsix
        working-directory: vscode-extension
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            changeshare-node.tar.gz
            changeshare-vscode.vsix
            install.sh
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            changeshare-node.tar.gz
            changeshare-vscode.vsix
            install.sh
          fail_on_unmatched_files: true
